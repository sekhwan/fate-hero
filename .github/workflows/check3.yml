name: check3
on:
  push:
    branches: [check3]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir -p out
          { echo "dns:"; dig +short vet.mypet.co.kr CNAME; dig +short vet.mypet.co.kr A;
            echo "http: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' http://vet.mypet.co.kr/)";
            echo "https: $(curl -s -o out/page.html -w '%{http_code}' https://vet.mypet.co.kr/)";
            echo "title: $(grep -o '<title>[^<]*' out/page.html | head -1)";
            echo "engine: $(curl -s https://vet.mypet.co.kr/engine.js | grep -o "ENGINE_VERSION='[0-9.]*'")";
            echo "old url: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://sekhwan.github.io/fate-hero/)";
            echo "config: $(curl -s https://vet.mypet.co.kr/config.js | grep -o 'supabaseUrl: "[^"]*"')"; } > out/dom.txt 2>&1
          rm -f out/page.html
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan check3-out8; git rm -rfq --cached .; git add -f out; git commit -qm out; git push -f origin check3-out8
