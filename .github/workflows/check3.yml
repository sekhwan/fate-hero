name: check3
on:
  push:
    branches: [check3]
permissions:
  contents: write
env:
  PROJECT_REF: shrxpippitspelhfhvbo
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - shell: bash {0}
        run: |
          mkdir -p out
          supabase --version > out/ver.txt 2>&1
          supabase functions deploy start-run --no-verify-jwt --project-ref "$PROJECT_REF" > out/fn1.txt 2>&1; echo "exit $?" >> out/fn1.txt
          supabase functions deploy submit-run --no-verify-jwt --project-ref "$PROJECT_REF" > out/fn2.txt 2>&1; echo "exit $?" >> out/fn2.txt
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan check3-out7; git rm -rfq --cached .; git add -f out; git commit -qm out; git push -f origin check3-out7
