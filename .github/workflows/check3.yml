name: check3
on:
  push:
    branches: [check3]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY || secrets.BUTLERKEY }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir -p out
          echo "keylen ${#BUTLER_API_KEY}" > out/key.txt
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default > out/dl.txt 2>&1; echo "dl $?" >> out/dl.txt
          unzip -q butler.zip -d butler >> out/dl.txt 2>&1; chmod +x butler/butler || true
          ./butler/butler -V > out/ver.txt 2>&1 || true
          mkdir -p tiny && echo '<html>t</html>' > tiny/index.html
          ./butler/butler status lightsc/fate-hero > out/status.txt 2>&1 || true
          curl -sS -w 'cfg %{http_code}\n' https://sekhwan.github.io/fate-hero/config.js -o public/config.js > out/cfg.txt 2>&1; ls public >> out/cfg.txt
          V=$(grep -o "ENGINE_VERSION='[0-9.]*'" public/engine.js | grep -o "[0-9.]*"); echo "V=[$V] sha=${GITHUB_SHA::7}" > out/v.txt
          ./butler/butler push public "lightsc/fate-hero:html5" --userversion "$V-${GITHUB_SHA::7}" > out/push.txt 2>&1; echo "exit $?" >> out/push.txt
          sed -i "s/$BUTLER_API_KEY/***/g" out/*.txt || true
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan check3-out4; git rm -rfq . ; git add -f out; git commit -qm out; git push -f origin check3-out4
