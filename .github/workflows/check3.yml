name: check3
on:
  push:
    branches: [check3]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY || secrets.BUTLERKEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          echo "keylen ${#BUTLER_API_KEY}" > out/key.txt
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default > out/dl.txt 2>&1; echo "dl $?" >> out/dl.txt
          unzip -q butler.zip -d butler >> out/dl.txt 2>&1; chmod +x butler/butler || true
          ./butler/butler -V > out/ver.txt 2>&1 || true
          mkdir -p tiny && echo '<html>t</html>' > tiny/index.html
          ./butler/butler status lightsc/fate-hero > out/status.txt 2>&1 || true
          ./butler/butler push tiny lightsc/fate-hero:diag --dry-run > out/push.txt 2>&1 || true
          sed -i "s/$BUTLER_API_KEY/***/g" out/*.txt || true
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan check3-out2; git rm -rfq . ; git add -f out; git commit -qm out; git push -f origin check3-out2
