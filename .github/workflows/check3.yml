name: check3
on:
  push:
    branches: [check3]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir -p out
          K=$(curl -fsS https://sekhwan.github.io/fate-hero/config.js | grep -o 'anonKey: "[^"]*"' | cut -d'"' -f2)
          B=https://shrxpippitspelhfhvbo.supabase.co/rest/v1
          H=(-H "apikey: $K"); case "$K" in eyJ*) H+=(-H "Authorization: Bearer $K");; esac
          echo "runs $(curl -s "${H[@]}" "$B/runs?select=seed" | jq length) cards $(curl -s "${H[@]}" "$B/pvp_cards?select=id" | jq length) humans $(curl -s "${H[@]}" "$B/pvp_cards?select=id&is_bot=eq.false" | jq length) matches $(curl -s "${H[@]}" "$B/pvp_matches?select=id" | jq length)" > out/after.txt
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan check3-out6; git rm -rfq --cached .; git add -f out; git commit -qm out; git push -f origin check3-out6
