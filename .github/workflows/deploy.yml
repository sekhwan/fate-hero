# main에 올라오면 1) Supabase DB·서버 함수를 배포하고 2) public 폴더를 GitHub Pages에 올린다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  PROJECT_REF: shrxpippitspelhfhvbo
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: link
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: db push
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: RUN_SECRET (처음 한 번만 무작위로 만든다)
        run: |
          if ! supabase secrets list --project-ref "$PROJECT_REF" | grep -q RUN_SECRET; then
            supabase secrets set RUN_SECRET="$(openssl rand -hex 32)" --project-ref "$PROJECT_REF"
          fi
      - name: functions
        run: |
          supabase functions deploy start-run --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy submit-run --no-verify-jwt --project-ref "$PROJECT_REF"
      - name: smoke test
        run: |
          KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | jq -r '[.[]|select(.name=="anon" or .type=="publishable")][0].api_key')
          curl -fsS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/start-run" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
  pages:
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: config.js (공개 키를 Supabase에서 직접 받아 넣는다)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | jq -r '[.[]|select(.name=="anon" or .type=="publishable")][0].api_key')
          test -n "$KEY" && test "$KEY" != "null"
          printf 'window.FATE_CONFIG = { supabaseUrl: "https://%s.supabase.co", anonKey: "%s" };\n' "$PROJECT_REF" "$KEY" > public/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
  e2e:
    needs: pages
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 실제 서버로 한 판 등록해 보고 지운다
        run: |
          J=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json)
          export REF="$PROJECT_REF"
          export ANON=$(echo "$J" | jq -r '[.[]|select(.name=="anon" or .type=="publishable")][0].api_key')
          export SERVICE=$(echo "$J" | jq -r '[.[]|select(.name=="service_role" or .type=="secret")][0].api_key')
          echo "::add-mask::$SERVICE"
          node tools/e2e.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 월드랭킹(봇 100명, 대전, 권한)을 실제 DB로 점검하고 시험 카드를 지운다
        run: |
          J=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json)
          export SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          export ANON=$(echo "$J" | jq -r '[.[]|select(.name=="anon" or .type=="publishable")][0].api_key')
          export SERVICE_KEY=$(echo "$J" | jq -r '[.[]|select(.name=="service_role" or .type=="secret")][0].api_key')
          echo "::add-mask::$SERVICE_KEY"
          deno run --allow-net --allow-env tools/world-e2e.ts
      - uses: oven-sh/setup-bun@v2
      - name: 사파리 엔진(JavaScriptCore)으로 둔 기록을 서버 엔진(V8)으로 재생해 일치 확인
        run: |
          bun tools/xengine-gen.js ../public/engine.js /tmp/jsc.json
          node tools/xengine-check.js ../public/engine.js /tmp/jsc.json | tee /tmp/x.txt
          grep -q "bad 0" /tmp/x.txt
      - name: 게시된 페이지 확인
        run: |
          curl -fsS "https://sekhwan.github.io/fate-hero/" | grep -q '운명의 용사'
          V=$(grep -o "ENGINE_VERSION='[0-9.]*'" public/engine.js); sleep 20; curl -fsS "https://sekhwan.github.io/fate-hero/engine.js" | grep -q "$V"
