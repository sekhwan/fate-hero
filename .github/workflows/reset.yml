# 랭킹 초기화: 먼저 전체를 reset-backup 브랜치에 백업한 뒤, 등록 기록·월드랭킹(봇 제외)·대전 기록을 지운다
name: reset
on:
  push:
    branches: [reset]
permissions:
  contents: write
env:
  PROJECT_REF: shrxpippitspelhfhvbo
jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: backup and reset
        run: |
          SERVICE=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | jq -r '[.[]|select(.name=="service_role" or .type=="secret")][0].api_key')
          echo "::add-mask::$SERVICE"
          AUTH=""; case "$SERVICE" in eyJ*) AUTH="Authorization: Bearer $SERVICE";; esac
          B="https://$PROJECT_REF.supabase.co/rest/v1"
          H=(-H "apikey: $SERVICE" -H "$AUTH")
          mkdir -p out
          curl -fsS "${H[@]}" "$B/runs?select=*&limit=100000" > out/runs.json
          curl -fsS "${H[@]}" "$B/pvp_cards?select=*&limit=100000" > out/pvp_cards.json
          curl -fsS "${H[@]}" "$B/pvp_matches?select=*&limit=100000" > out/pvp_matches.json
          echo "before: runs $(jq length out/runs.json), cards $(jq length out/pvp_cards.json), matches $(jq length out/pvp_matches.json)" | tee out/summary.txt
          git config user.name reset-bot; git config user.email reset-bot@users.noreply.github.com
          git checkout --orphan reset-backup-2; git rm -rfq --cached . ; git add -f out; git commit -qm "랭킹 초기화 직전 백업"; git push -f origin reset-backup-2
          curl -fsS -X DELETE "${H[@]}" "$B/pvp_matches?id=gte.0"
          curl -fsS -X DELETE "${H[@]}" "$B/pvp_cards?is_bot=eq.false"
          curl -fsS -X DELETE "${H[@]}" "$B/runs?seed=not.is.null"
          echo "after: runs $(curl -fsS "${H[@]}" "$B/runs?select=seed" | jq length), cards $(curl -fsS "${H[@]}" "$B/pvp_cards?select=id" | jq length), bots $(curl -fsS "${H[@]}" "$B/pvp_cards?select=id&is_bot=eq.true" | jq length), matches $(curl -fsS "${H[@]}" "$B/pvp_matches?select=id" | jq length)"
